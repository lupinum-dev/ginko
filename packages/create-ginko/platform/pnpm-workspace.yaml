# Convex bundles the backend functions from node_modules/@lupinum/ginko-server (convex.json). It fails on the
# symlinks of pnpm's default layout, so pnpm must put real folders into node_modules, as npm does.
nodeLinker: hoisted
# pnpm 11 stops `pnpm install` with an error until you say which packages may run install scripts.
allowBuilds:
  esbuild: true
  sharp: true
