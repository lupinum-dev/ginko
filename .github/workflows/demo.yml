# The demo platform lupinum-ginko-demo (internals/decisions.md D55): every template runs there as a site with its
# content in the Studio. Its Vercel project is linked to main: each production build deploys the Convex backend, then
# the Studio (`ginko-platform build` in apps/platform); the template sites deploy through their own Vercel Git links.
# Here, on each push to main, every template site gets its schema (`ginko release` with GINKO_CONTENT=platform, the
# path a client site takes too); a release that needs backend code the Vercel build has not deployed yet fails, and a
# run by hand repeats it. Every Monday night, and when started by hand, the template sites get their content back from
# git with this week's dates (`pnpm templates demo-reset`). The Monday run resets every site and releases none. By hand,
# the input `site` picks one template (release and reset of that site only) or `all` (release and reset of every site).
# A reset also ends the access the demos gave: members and invites without a `.test` address go (D65).
# Environment `demo`: secret DEMO_CONVEX_DEPLOY_KEY (the demo deployment only, for the reset), one push key per
# template site, DEMO_GINKO_KEY_<TEMPLATE>, named one by one in the release step, and variable DEMO_PLATFORM (the
# platform's address: the demo Convex deployment's .convex.site URL). One whole secret per key: GitHub masks a secret
# only as a whole, so a key read out of a JSON secret appeared in the log.
name: demo

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      site:
        description: Site to reset (a template is released first; Lupinum's own sites release in their own repositories)
        type: choice
        default: all
        # Keep in step with the release matrix and the reset-sites matrix below.
        options: [all, starter, blog, portfolio, company, saas, docs, restaurant, local-business, nonprofit, events, kathode, linde, ufergruen]

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'schedule' && !contains(fromJSON('["kathode","linde","ufergruen"]'), inputs.site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    strategy:
      fail-fast: false
      matrix:
        # The site slug is the template's name (`site` in its ginko.config.ts). A run by hand for one site releases only
        # that one, so another template's failing release cannot block its reset. `inputs.site` is empty on push.
        template: ${{ fromJSON(inputs.site && inputs.site != 'all' && format('["{0}"]', inputs.site) || '["starter","blog","portfolio","company","saas","docs","restaurant","local-business","nonprofit","events"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./templates/${{ matrix.template }} exec ginko release
        env:
          GINKO_CONTENT: platform
          # The site's address in the released schema (site-url.ts): the template's Vercel production address.
          NUXT_PUBLIC_SITE_URL: https://ginko-template-${{ matrix.template }}.vercel.app
          GINKO_PLATFORM: ${{ vars.DEMO_PLATFORM }}
          # Static names only: a dynamic `secrets[…]` hands every repository and organisation secret to the runner.
          GINKO_KEY: ${{ matrix.template == 'starter' && secrets.DEMO_GINKO_KEY_STARTER || matrix.template == 'blog' && secrets.DEMO_GINKO_KEY_BLOG || matrix.template == 'portfolio' && secrets.DEMO_GINKO_KEY_PORTFOLIO || matrix.template == 'company' && secrets.DEMO_GINKO_KEY_COMPANY || matrix.template == 'saas' && secrets.DEMO_GINKO_KEY_SAAS || matrix.template == 'docs' && secrets.DEMO_GINKO_KEY_DOCS || matrix.template == 'restaurant' && secrets.DEMO_GINKO_KEY_RESTAURANT || matrix.template == 'local-business' && secrets.DEMO_GINKO_KEY_LOCAL_BUSINESS || matrix.template == 'nonprofit' && secrets.DEMO_GINKO_KEY_NONPROFIT || matrix.template == 'events' && secrets.DEMO_GINKO_KEY_EVENTS }}

  # After the release when started by hand; on the Monday schedule the release is skipped and this runs alone.
  reset:
    needs: release
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && !contains(fromJSON('["kathode","linde","ufergruen"]'), inputs.site) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # The schedule has no inputs, so SITE is `all` there.
      - run: if [ "$SITE" = all ]; then pnpm templates demo-reset --all; else pnpm templates demo-reset "$SITE"; fi
        env:
          SITE: ${{ inputs.site || 'all' }}
          CONVEX_DEPLOY_KEY: ${{ secrets.DEMO_CONVEX_DEPLOY_KEY }}

  # Lupinum's own demo sites live in private repositories (lupinum-dev/<slug>-demo), not in templates/: after the
  # template reset (or alone, when started by hand for one of them), each site's checkout replaces its content
  # (`demo-reset --from`, same steps as a template). Read access: one read-only deploy key per site repository, stored
  # here as DEMO_SITE_KEY_<SITE>. A site whose key is not set is skipped and the job stays green.
  reset-sites:
    needs: reset
    if: ${{ !cancelled() && github.event_name != 'push' && (inputs.site == '' || inputs.site == 'all' || contains(fromJSON('["kathode","linde","ufergruen"]'), inputs.site)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(contains(fromJSON('["kathode","linde","ufergruen"]'), inputs.site) && format('["{0}"]', inputs.site) || '["kathode","linde","ufergruen"]') }}
    steps:
      - id: key
        # Static names only: a dynamic `secrets[…]` hands every repository and organisation secret to the runner.
        run: |
          if [ -n "$SITE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "SKIP demo-reset $SITE: secret DEMO_SITE_KEY_$SITE_UPPER is not set, so the site keeps its content."; fi
        env:
          SITE: ${{ matrix.site }}
          SITE_KEY: ${{ matrix.site == 'kathode' && secrets.DEMO_SITE_KEY_KATHODE || matrix.site == 'linde' && secrets.DEMO_SITE_KEY_LINDE || matrix.site == 'ufergruen' && secrets.DEMO_SITE_KEY_UFERGRUEN }}
          SITE_UPPER: ${{ matrix.site == 'kathode' && 'KATHODE' || matrix.site == 'linde' && 'LINDE' || 'UFERGRUEN' }}
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ginko
          persist-credentials: false
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lupinum-dev/${{ matrix.site }}-demo
          ref: main
          path: site
          ssh-key: ${{ matrix.site == 'kathode' && secrets.DEMO_SITE_KEY_KATHODE || matrix.site == 'linde' && secrets.DEMO_SITE_KEY_LINDE || matrix.site == 'ufergruen' && secrets.DEMO_SITE_KEY_UFERGRUEN }}
          persist-credentials: false
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - if: steps.key.outputs.set == 'true'
        run: corepack enable pnpm && pnpm install --frozen-lockfile
        working-directory: ginko
      # The site checkout has no packageManager field: the pnpm version of its lockfile.
      - if: steps.key.outputs.set == 'true'
        run: npx --yes pnpm@11.28.5 install --frozen-lockfile
        working-directory: site
      - if: steps.key.outputs.set == 'true'
        run: pnpm templates demo-reset --from ../site
        working-directory: ginko
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEMO_CONVEX_DEPLOY_KEY }}
