# The demo platform lupinum-ginko-demo (internals/decisions.md D55): every template runs there as a site with its
# content in the Studio. Its Vercel project is linked to main: each production build deploys the Convex backend, then
# the Studio (apps/platform/scripts/vercel-build.sh); the template sites deploy through their own Vercel Git links.
# Here, on each push to main, every template site gets its schema (`ginko release` with GINKO_CONTENT=platform, the
# path a client site takes too); a release that needs backend code the Vercel build has not deployed yet fails, and a
# run by hand repeats it. Every Monday night, and when started by hand, the template sites get their content back from
# git with this week's dates (`pnpm templates demo-reset --all`).
# Environment `demo`: secret DEMO_CONVEX_DEPLOY_KEY (the demo deployment only, for the reset), one push key per
# template site, DEMO_GINKO_KEY_<TEMPLATE>, named one by one in the release step, and variable DEMO_PLATFORM (the
# platform's address: the demo Convex deployment's .convex.site URL). One whole secret per key: GitHub masks a secret
# only as a whole, so a key read out of a JSON secret appeared in the log.
name: demo

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    strategy:
      fail-fast: false
      matrix:
        # The site slug is the template's name (`site` in its ginko.config.ts).
        template: [starter, blog, portfolio, company, saas, docs, restaurant, local-business, nonprofit, events]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./templates/${{ matrix.template }} exec ginko release
        env:
          GINKO_CONTENT: platform
          # The site's address in the released schema (site-url.ts): the template's Vercel production address.
          NUXT_PUBLIC_SITE_URL: https://ginko-template-${{ matrix.template }}.vercel.app
          GINKO_PLATFORM: ${{ vars.DEMO_PLATFORM }}
          # Static names only: a dynamic `secrets[…]` hands every repository and organisation secret to the runner.
          GINKO_KEY: ${{ matrix.template == 'starter' && secrets.DEMO_GINKO_KEY_STARTER || matrix.template == 'blog' && secrets.DEMO_GINKO_KEY_BLOG || matrix.template == 'portfolio' && secrets.DEMO_GINKO_KEY_PORTFOLIO || matrix.template == 'company' && secrets.DEMO_GINKO_KEY_COMPANY || matrix.template == 'saas' && secrets.DEMO_GINKO_KEY_SAAS || matrix.template == 'docs' && secrets.DEMO_GINKO_KEY_DOCS || matrix.template == 'restaurant' && secrets.DEMO_GINKO_KEY_RESTAURANT || matrix.template == 'local-business' && secrets.DEMO_GINKO_KEY_LOCAL_BUSINESS || matrix.template == 'nonprofit' && secrets.DEMO_GINKO_KEY_NONPROFIT || matrix.template == 'events' && secrets.DEMO_GINKO_KEY_EVENTS }}

  # After the release when started by hand; on the Monday schedule the release is skipped and this runs alone.
  reset:
    needs: release
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm templates demo-reset --all
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEMO_CONVEX_DEPLOY_KEY }}
