# Every pull request and push to main: types, unit tests, the demo sites' published schemas, and the
# release gate (pack the released packages, install a new site from the tarballs, build and serve it).
# Pull requests also run the platform e2e.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml starts this workflow on the Version packages PR, because pull requests
  # opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:contracts
      - run: pnpm check:pack

  # Only production advisories that reach a published package block releases (scripts/audit-deps.mjs).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: node scripts/audit-deps.mjs

  # The released packages on Nuxt 5 (internals/decisions.md D3): the starters and the docs site, installed from
  # the tarballs on the Nuxt 5 nightly that packages/ginko-i18n/browser/apps/n5 pins.
  nuxt5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pack --nuxt5

  # ginko-i18n browser suites (routing, hydration, SEO, zones; DECISIONS.md D3): the only proof for the
  # module setup, plugin and middleware. They take 10–20 minutes, so they run only when a pull request
  # changes packages/ginko-i18n.
  i18n-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages/ginko-i18n; then
            echo "i18n=false" >> "$GITHUB_OUTPUT"
          else
            echo "i18n=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.i18n == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.changed.outputs.i18n == 'true'
        run: corepack enable pnpm
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm i18n:browser
      - if: always() && steps.changed.outputs.i18n == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: i18n-browser-evidence
          path: packages/ginko-i18n/browser/.evidence
          include-hidden-files: true
          if-no-files-found: ignore

  # Platform e2e (apps/platform/e2e, UI.md 9): the Studio against a fresh local Convex backend, with real sign-in
  # through the local outbox and the restaurant site for the preview. It runs on every pull request, beside the
  # other jobs, so no machine of ours has to run it. Traces of failed tests and the backend log are kept.
  platform-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:platform
        env:
          GINKO_NO_LOAD_WAIT: '1'
          GINKO_E2E_LOGS: ${{ runner.temp }}/e2e-logs
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-e2e-evidence
          path: |
            apps/platform/test-results
            ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore

  # The one required status check for the main branch ruleset, and the check release.yml waits for
  # before it publishes. i18n-browser and platform-e2e are skipped outside pull requests, so `skipped` counts as passing.
  ci:
    name: ci
    if: always()
    needs: [check, audit, nuxt5, i18n-browser, platform-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
