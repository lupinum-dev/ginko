# Every pull request and push to main: types, unit tests, the demo sites' published schemas, and the
# release gate (pack the released packages, install a new site from the tarballs, build and serve it).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml starts this workflow on the Version packages PR, because pull requests
  # opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:contracts
      - run: pnpm check:pack

  # ginko-i18n browser suites (routing, hydration, SEO, zones; DECISIONS.md D3): the only proof for the
  # module setup, plugin and middleware. They take 10–20 minutes, so they run only when a pull request
  # changes packages/ginko-i18n.
  i18n-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages/ginko-i18n; then
            echo "i18n=false" >> "$GITHUB_OUTPUT"
          else
            echo "i18n=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.i18n == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.i18n == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changed.outputs.i18n == 'true'
        run: pnpm i18n:browser
      - if: always() && steps.changed.outputs.i18n == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-browser-evidence
          path: packages/ginko-i18n/browser/.evidence
          include-hidden-files: true
          if-no-files-found: ignore

  # The one required status check for the main branch ruleset, and the check release.yml waits for
  # before it publishes. i18n-browser is skipped outside pull requests, so `skipped` counts as passing.
  ci:
    name: ci
    if: always()
    needs: [check, i18n-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
