# The client platform lupinum-ginko-cms (internals/decisions.md D55) runs released code only. After the release
# workflow, a commit with a v* tag deploys there: Vercel builds apps/platform, whose production build deploys the Convex
# backend first (apps/platform/scripts/vercel-build.sh; CONVEX_DEPLOY_KEY lives in that Vercel project only). The
# release workflow's own tag push starts no workflow (GITHUB_TOKEN), hence workflow_run. A run by hand takes a tag, for
# a redeploy or a rollback. Environment `cms` (required reviewer: Matthias): secret VERCEL_TOKEN, variables
# VERCEL_ORG_ID and VERCEL_PROJECT_ID of the lupinum-ginko-cms project, which has no Git link.
name: cms

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v0.6.0
        required: true

permissions:
  contents: read

concurrency:
  group: cms
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      # Every push to main runs the release workflow; only one that tagged its commit is a release.
      - id: tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then echo "::notice::No release tag on $(git rev-parse --short HEAD): nothing to deploy."; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cms
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
