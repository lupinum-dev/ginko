# Lint, type-check and build on every push and pull request.
# To use pnpm instead of npm: commit a pnpm-lock.yaml, add `- run: corepack enable pnpm` before the install step,
# and replace `npm install` with `pnpm install --frozen-lockfile` and `npm run` with `pnpm run`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
